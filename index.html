<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>STEAL THE EGG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Верхняя часть -->
    <header class="top">

        <div class="logo">
            STEAL THE EGG
        </div>

        <div class="balance">
            <span>🪙</span>
            <span id="tapCoins">0</span>
        </div>

        <div class="balance-name">
            TAP COINS
        </div>

    </header>


    <!-- Игра -->
    <main class="game">

        <div class="egg-name">
            КОСМИЧЕСКОЕ ЯЙЦО
        </div>

        <button
            class="egg-button"
            id="eggButton"
        >

            <div class="egg-glow"></div>

            <div class="egg">
                🥚
            </div>

        </button>

        <div class="tap-hint">
            👆 ТАПАЙ ПО ЯЙЦУ
        </div>

    </main>


    <!-- Нижнее меню -->
    <nav class="bottom-menu">

        <button class="menu-button active">
            <span>🏠</span>
            <small>Главная</small>
        </button>

        <button
            class="menu-button"
            id="eggsButton"
        >
            <span>🥚</span>
            <small>Яйца</small>
        </button>

        <button
            class="menu-button"
            id="shopButton"
        >
            <span>🛒</span>
            <small>Магазин</small>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
